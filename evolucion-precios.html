<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evolución de precios</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="evolucion-precios.css">
</head>

<body>

<header class="ep-header">

    <div class="ep-header-inner">

        <a href="/" class="ep-logo">
            <span>📊</span>
            <span>Evolución de precios</span>
        </a>

        <div class="ep-search">
            <span>🔎</span>
            <input
                type="search"
                id="busqueda"
                placeholder="Buscar producto, marca o EAN..."
                autocomplete="off"
            >
        </div>

    </div>

</header>


<main class="ep-container">

    <section class="ep-toolbar">

        <div>
            <h1>Comparador de precios</h1>
            <p id="estado-datos">Cargando precios...</p>
        </div>

        <div class="ep-toolbar-actions">

            <button
                id="vista-grid"
                class="vista-btn activo"
                type="button"
                title="Vista cuadrícula"
            >
                ▦
            </button>

            <button
                id="vista-lista"
                class="vista-btn"
                type="button"
                title="Vista lista"
            >
                ☷
            </button>

        </div>

    </section>


    <section id="catalogo-productos" class="productos-grid"></section>


    <section id="sin-resultados" class="sin-resultados oculto">

        <div>🔎</div>

        <h2>No encontramos productos</h2>

        <p>
            Probá buscando por nombre, marca o código EAN.
        </p>

    </section>


    <section id="detalle-producto" class="detalle oculto">

        <button
            id="volver-productos"
            class="btn-volver"
            type="button"
        >
            ← Volver a productos
        </button>

        <div id="detalle-contenido"></div>

    </section>

</main>


<div id="modal-historico" class="modal oculto">

    <div class="modal-overlay" id="cerrar-modal-overlay"></div>

    <div class="modal-contenido">

        <button
            id="cerrar-modal"
            class="modal-cerrar"
            type="button"
        >
            ×
        </button>

        <div id="historico-contenido"></div>

    </div>

</div>


<script src="evolucion-precios.js"></script>

</body>
</html>
